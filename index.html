<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho T1</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <div>
            <h1>Reservas e Agendametos</h1>
        </div>
    </header>
        <p></p>
            <label>Solicitante: </label>
            <input type="text" id="filtroSolicitante" name="solicitante" >
            <label>Bloco: </label>
            <select id="filtroBloco">
                <option value="">Todos</option>
                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
            </select>
            <label>Sala: </label>
            <select id="filtroSala">
                <option value="">Todas</option>
                <option>Sala 1</option>
                <option>Sala 2</option>
                <option>Sala 3</option>
                <option>Sala 4</option>
                <option>Sala 5</option>
            </select>
            <label>Data: </label>
            <input type="date" id="filtroData" name="data">
            <label>Turno</label>
            <select id="filtroTurno">
                <option value="">Todos</option>
                <option>Matutino</option>
                <option>Vespertino</option>
                <option>Noturno</option>
            </select>
    <button id="abrirModal">Novo Agendamento</button>
<p></p>
    <dialog id="meuModal">
         <h2>Novo Agendamento</h2>
         <p>
            <label>Solicitante: </label>
            <input type="text"  id="solicitante" name="solicitante">
         </p>
         <p>
            <label>Bloco: </label>
            <select id="bloco">
                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
            </select>
         </p>
         <p>
            <label>Sala: </label>
            <select id="sala">
                <option>Sala 1</option>
                <option>Sala 2</option>
                <option>Sala 3</option>
                <option>Sala 4</option>
                <option>Sala 5</option>
            </select>
         </p>
         <p>
            <label>Data: </label>
            <input type="date" id="data" name="data">
         </p>
         <p>
            <label>Turno</label>
            <select id="turno">
                <option>Matutino</option>
                <option>Vespertino</option>
                <option>Noturno</option>
            </select>
         </p>
         <button id="fecharModal">Fechar</button>
         <button id="salvarModal">Salvar</button>
    </dialog>

    <table class="table table-success table-striped-columns" >
        <thead>
            <tr>
                <th scope="col">Solicitante</th>
                <th scope="col">Bloco</th>
                <th scope="col">Sala</th>
                <th scope="col">Data</th>
                <th scope="col">Turno</th>
                <th scope="col">Ações</th>
            </tr>
            <tbody id="tabela">
            </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
