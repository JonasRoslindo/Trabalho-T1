<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamento de Salas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<body class="bg-light">
    <header class="mb-4">
        <h1 class="text-center">
            SISTEMA DE AGENDAMENTO DE SALAS
        </h1>
    </header>
    <div class="container py-4">
        <div class="row" id="metricaAll">

            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <span class="text-muted">Total Reservas</span>
                        <h3 class="fw-bold" id="totalReservas">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <span class="text-muted">Total Reservas de Hoje</span>
                        <h3 class="fw-bold" id="totalDeHoje">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <span class="text-muted">Turno Noite</span>
                        <h3 class="fw-bold" id="totalNoite">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <span class="text-muted">Turno Dia</span>
                        <h3 class="fw-bold" id="totalDia">0</h3>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <section class="card mt-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Filtros</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="filtroSolicitante" class="form-label">
                            Solicitante:
                        </label>
                        <input type="text"
                               id="filtroSolicitante"
                               name="Solicitante"
                               class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label for="dataFiltro" class="form-label">
                            Data:
                        </label>
                        <input type="date"
                               id="filtroData"
                               name="Data"
                               class="form-control">
                    </div>

                    <div class="col-md-2">
                        <label for="blocos" class="form-label">
                            Bloco:
                        </label>
                        <select id="filtroBloco"
                                name="Blocos"
                                class="form-select">
                            <option value="">Todos</option>
                            <option>A</option>
                            <option>B</option>
                            <option>C</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="salas" class="form-label">
                            Sala:
                        </label>
                        <select id="filtroSala"
                                name="salas"
                                class="form-select">
                            <option value="">Todos</option>
                            <option>Sala 1</option>
                            <option>Sala 2</option>
                            <option>Sala 3</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="turno" class="form-label">
                            Turno
                        </label>
                        <select id="filtroTurno"
                                name="turno"
                                class="form-select">
                            <option value="">Todos</option>
                            <option>Matutino</option>
                            <option>Vespertino</option>
                            <option>Noturno</option>
                        </select>
                    </div>

                    <div class="col-12 d-flex justify-content-end gap-2">
                        <button class="btn btn-secondary" id="btnLimpar">
                            Limpar
                        </button>
                        <button id="abrirModal" class="btn btn-primary">
                            Novo Agendamento
                        </button>
                    </div>
                </div>
            </div>

        </section>

        <dialog id="meuModal">
            <h2>Novo Agendamento</h2>
            <p>
                <label>Solicitante: </label>
                <input type="text" id="solicitante" name="solicitante">
            </p>
            <p>
                <label>Bloco: </label>
                <select id="bloco">
                    <option>A</option>
                    <option>B</option>
                    <option>C</option>
                    <option>D</option>
                </select>
            </p>
            <p>
                <label>Sala: </label>
                <select id="sala">
                    <option>Sala 1</option>
                    <option>Sala 2</option>
                    <option>Sala 3</option>
                    <option>Sala 4</option>
                    <option>Sala 5</option>
                </select>
            </p>
            <p>
                <label>Data: </label>
                <input type="date" id="data" name="data">
            </p>
            <p>
                <label>Turno</label>
                <select id="turno">
                    <option>Matutino</option>
                    <option>Vespertino</option>
                    <option>Noturno</option>
                </select>
            </p>
            <button id="fecharModal">Fechar</button>
            <button id="salvarModal">Salvar</button>
        </dialog>
    </section>

    <table class="table table-striped-columns">
        <thead>
            <tr>
                <th scope="col">Solicitante</th>
                <th scope="col">Bloco</th>
                <th scope="col">Sala</th>
                <th scope="col">Data</th>
                <th scope="col">Turno</th>
                <th scope="col">Ações</th>
            </tr>
        <tbody id="tabela"></tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
