<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamento de Salas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<body>
    <header>
        <p>Sistema de Agendamento de Salas</p>
    </header>
    <div class="metricaTotal">
        <span>Total reservas: </span>
        <span>12</span>
        <div class="metricaFiltrados">
            <span>Filtrados: </span>
            <span>12</span>
        </div>
        <div class="metricaTurnos">
            <span>Turno Noite: </span>
            <span>12</span>
        </div>
        <div class="metricaBlocos">
            <span>Blocos: </span>
            <span>12</span>
        </div>
    </div>

    <section>
        <label for="name">Solicitante:</label>
        <input type="Text" name="Solicitante">
        <label for="data">Data:</label>
        <input type="date" date="Data">
        <label for="select">Bloco:</label>
        <select id=blocos name=Blocos>
            <option>A</option>
            <option>B</option>
            <option>C</option>
        </select>
        <label for="select">Salas:</label>
        <select id=salas name=salas>
            <option>Sala 1</option>
            <option>Sala 2</option>
            <option>Sala 3</option>
        </select>
        <button>Limpar</button>
        <button id="abrirModal">Novo Agendamento</button>

        <dialog id="meuModal">
            <h2>Novo Agendamento</h2>
            <p>
                <label>Solicitante: </label>
                <input type="text" name="solicitante">
            </p>
            <p>
                <label>Bloco: </label>
                <select>
                    <option>A</option>
                    <option>B</option>
                    <option>C</option>
                    <option>D</option>
                </select>
            </p>
            <p>
                <label>Sala: </label>
                <select>
                    <option>Sala 1</option>
                    <option>Sala 2</option>
                    <option>Sala 3</option>
                    <option>Sala 4</option>
                    <option>Sala 5</option>
                </select>
            </p>
            <p>
                <label>Data: </label>
                <input type="date" name="data">
            </p>
            <p>
                <label>Turno</label>
                <select>
                    <option>Matutino</option>
                    <option>Vespertino</option>
                    <option>Noturno</option>
                </select>
            </p>
            <button id="fecharModal">Fechar</button>
        </dialog>
    </section>

    <table class="table table-success table-striped-columns">
        <thead>
            <tr>
                <th scope="col">Solicitante</th>
                <th scope="col">Bloco</th>
                <th scope="col">Sala</th>
                <th scope="col">Data</th>
                <th scope="col">Turno</th>
                <th scope="col">Ações</th>
            </tr>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
