<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamento de Salas</title>
    <!-- Carrega o arquivo CSS do Bootstrap pela CDN (biblioteca online). -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<body class="bg-light"> <!-- bg-light: aplica um fundo claro ao body. -->
    <!-- mb-4: adiciona margem inferior. text-center: centraliza o texto. -->
    <header class="mb-4">
        <h1 class="text-center">
            SISTEMA DE AGENDAMENTO DE SALAS
        </h1>
    </header>
    <!-- container limita a largura e centraliza o conteudo da pagina. -->
    <!-- py-4 adiciona espacamento interno em cima e embaixo. -->
    <div class="container py-4">
        <!-- row cria uma linha do grid do Bootstrap. -->
        <div class="row" id="metricaAll">

            <!-- col-md-3 ocupa 3 de 12 colunas em telas medias ou maiores. -->
            <!-- Em telas pequenas, as colunas ficam empilhadas. -->
            <div class="col-md-3">
                <!-- card cria um painel com borda; card-body adiciona espacamento interno. -->
                <!-- text-center centraliza o conteudo; shadow-sm adiciona uma sombra discreta. -->
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <!-- text-muted deixa o texto com uma cor mais suave. -->
                        <span class="text-muted">Total Reservas</span>
                        <!-- fw-bold aplica uma fonte mais grossa (negrito). -->
                        <h3 class="fw-bold" id="totalReservas">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <span class="text-muted">Total Reservas de Hoje</span>
                        <h3 class="fw-bold" id="totalDeHoje">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <span class="text-muted">Turno Noite</span>
                        <h3 class="fw-bold" id="totalNoite">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <span class="text-muted">Turno Dia</span>
                        <h3 class="fw-bold" id="totalDia">0</h3>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- mt-4 adiciona margem no topo; card transforma a secao em um painel. -->
    <section class="card mt-4">
            <div class="card-body">
                <!-- card-title identifica o titulo do painel; mb-3 cria margem abaixo. -->
                <h5 class="card-title mb-3">Filtros</h5>
                <!-- g-3 cria espaco entre as colunas e linhas do grid. -->
                <div class="row g-3">
                    <!-- form-label e form-control padronizam labels e campos de formulario. -->
                    <div class="col-md-3">
                        <label for="filtroSolicitante" class="form-label">
                            Solicitante:
                        </label>
                        <input type="text"
                               id="filtroSolicitante"
                               name="Solicitante"
                               class="form-control"> <!-- form-control estiliza inputs. -->
                    </div>

                    <div class="col-md-3">
                        <label for="dataFiltro" class="form-label">
                            Data:
                        </label>
                        <input type="date"
                               id="filtroData"
                               name="Data"
                               class="form-control">
                    </div>

                    <div class="col-md-2">
                        <label for="blocos" class="form-label">
                            Bloco:
                        </label>
                        <select id="filtroBloco"
                                name="Blocos"
                                class="form-select"> <!-- form-select estiliza selects. -->
                            <option value="">Todos</option>
                            <option>A</option>
                            <option>B</option>
                            <option>C</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="salas" class="form-label">
                            Sala:
                        </label>
                        <select id="filtroSala"
                                name="salas"
                                class="form-select">
                            <option value="">Todos</option>
                            <option>Sala 1</option>
                            <option>Sala 2</option>
                            <option>Sala 3</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="turno" class="form-label">
                            Turno
                        </label>
                        <select id="filtroTurno"
                                name="turno"
                                class="form-select">
                            <option value="">Todos</option>
                            <option>Matutino</option>
                            <option>Vespertino</option>
                            <option>Noturno</option>
                        </select>
                    </div>

                    <!-- col-12 ocupa a linha inteira; d-flex ativa flexbox. -->
                    <!-- justify-content-end alinha no fim; gap-2 cria espaco entre botoes. -->
                    <div class="col-12 d-flex justify-content-end gap-2">
                        <!-- btn define o formato de botao; btn-secondary define a cor cinza. -->
                        <button class="btn btn-secondary" id="btnLimpar">
                            Limpar
                        </button>
                        <!-- btn-primary aplica a cor principal do Bootstrap. -->
                        <button id="abrirModal" class="btn btn-primary">
                            Novo Agendamento
                        </button>
                    </div>
                </div>
            </div>

        </section>

        <dialog id="meuModal">
            <h2>Novo Agendamento</h2>
            <p>
                <label>Solicitante: </label>
                <input type="text" id="solicitante" name="solicitante">
            </p>
            <p>
                <label>Bloco: </label>
                <select id="bloco">
                    <option>A</option>
                    <option>B</option>
                    <option>C</option>
                    <option>D</option>
                </select>
            </p>
            <p>
                <label>Sala: </label>
                <select id="sala">
                    <option>Sala 1</option>
                    <option>Sala 2</option>
                    <option>Sala 3</option>
                    <option>Sala 4</option>
                    <option>Sala 5</option>
                </select>
            </p>
            <p>
                <label>Data: </label>
                <input type="date" id="data" name="data">
            </p>
            <p>
                <label>Turno</label>
                <select id="turno">
                    <option>Matutino</option>
                    <option>Vespertino</option>
                    <option>Noturno</option>
                </select>
            </p>
            <button id="fecharModal">Fechar</button>
            <button id="salvarModal">Salvar</button>
        </dialog>
    </section>

    <!-- table aplica o estilo base de tabela; table-striped-columns alterna as cores das colunas. -->
    <table class="table table-striped-columns">
        <thead>
            <tr>
                <th escopo="col">Solicitante</th>
                <th escopo="col">Bloco</th>
                <th escopo="col">Sala</th>
                <th escopo="col">Data</th>
                <th escopo="col">Turno</th>
                <th escopo="col">Ações</th>
            </tr>
        <tbody id="tabela"></tbody>
    </table>

    <!-- Carrega o JavaScript do Bootstrap para seus componentes interativos. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
